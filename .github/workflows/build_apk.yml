name: Build & Release Smart School Manager APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Production Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Validate Gradle Wrapper & Dependencies
        run: |
          chmod +x gradlew || true
          gradle --version

      - name: Run Unit Tests & Lint Checks
        run: |
          gradle testDebugUnitTest --continue

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace

      - name: Archive APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-school-manager-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          name: "Smart School Manager Release ${{ github.ref_name }}"
          body: |
            ## Smart School Manager (Primary & Middle School Edition)
            - Bilingual English & Urdu (RTL/LTR)
            - UIDAI Aadhaar compliant student lifecycle
            - Dual-register attendance with 1-tap bulk marking & undo
            - PDF Report Card generator with WhatsApp distribution
            - Textbook distribution audit & leave workflows
          draft: false
          prerelease: false
